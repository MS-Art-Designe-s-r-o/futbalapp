# FKKNV portál — produkčné nasadenie na JEDEN VPS (Lumadock/Contabo/Hetzner…).
# Jeden server obsluhuje databázu, API aj web; Caddy vybaví HTTPS automaticky.
#
#   cd infra
#   cp .env.example .env      # vyplňte heslá
#   chmod 600 .env
#   docker compose --env-file .env up -d --build
#
# Premenné (POSTGRES_PASSWORD, JWT_SECRET, voliteľne RESEND_*) sú v infra/.env.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fkknv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD je povinný}
      POSTGRES_DB: fkknv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fkknv']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fkknv:${POSTGRES_PASSWORD}@postgres:5432/fkknv?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET je povinný}
      CORS_ORIGIN: https://fkknv.sk
      EMAIL_FROM: ${EMAIL_FROM:-FK Košická Nová Ves <noreply@fkknv.sk>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Bankový účet klubu pre e-maily s predpismi — voliteľné
      # účet klubu pre e-maily s predpismi (dá sa prepísať v infra/.env)
      CLUB_IBAN: ${CLUB_IBAN:-SK7702000000000062639512}
      CLUB_ACCOUNT_NUMBER: ${CLUB_ACCOUNT_NUMBER:-62639-512/0200}
      CLUB_BANK_NAME: ${CLUB_BANK_NAME:-VÚB, a.s.}
      CLUB_ACCOUNT_NAME: ${CLUB_ACCOUNT_NAME:-FK Košická Nová Ves}
      # Veo (automatické hľadanie videa zo zápasu) — voliteľné
      VEO_CLIENT_ID: ${VEO_CLIENT_ID:-}
      VEO_USERNAME: ${VEO_USERNAME:-}
      VEO_PASSWORD: ${VEO_PASSWORD:-}
      # ISSF (synchronizácia hráčov klubu) — voliteľné
      ISSF_USERNAME: ${ISSF_USERNAME:-}
      ISSF_PASSWORD: ${ISSF_PASSWORD:-}
      ISSF_PLAYERS_URL: ${ISSF_PLAYERS_URL:-}
      ISSF_LOGIN_URL: ${ISSF_LOGIN_URL:-}
      ISSF_DEBUG: ${ISSF_DEBUG:-}
      # Verejné API (klubový web) — voliteľné
      CLUB_NAME: ${CLUB_NAME:-}
      CLUB_TIMEZONE: ${CLUB_TIMEZONE:-}
      # Videá zo zápasov nahrané z telefónu — ukladajú sa na disk (named volume nižšie)
      UPLOADS_DIR: /data/uploads
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-500}
      PORT: 3001
    volumes:
      # súbory prežijú rebuild/reštart kontajnera
      - uploads_data:/data/uploads
    # migrácie prebehnú automaticky pri štarte (viď Dockerfile.api CMD)

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        # zapeká sa do klientskeho bundle-u pri builde — musí byť verejná adresa API
        NEXT_PUBLIC_API_URL: https://api.fkknv.sk/api/v1
    environment:
      # server-side volania verejného API z web kontajnera (interná docker sieť)
      API_INTERNAL_URL: http://api:3001/api/v1
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
